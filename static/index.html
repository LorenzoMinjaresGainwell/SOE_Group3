<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rural Health Opportunity Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260727-2">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/gainwell-logo.png" alt="Gainwell Technologies">
        <div class="brand-title">
          <p class="eyebrow">Growth intelligence</p>
          <h1>Rural Health Opportunity Dashboard</h1>
        </div>
      </div>
      <a class="button-link" href="/?view=records">Federal Records</a>
    </header>

    <main>
      <section class="metrics" id="metrics"></section>

      <nav class="category-tabs" id="categoryTabs" aria-label="Opportunity source categories"></nav>

      <section class="toolbar" aria-label="Opportunity filters">
        <label>
          Search
          <input id="searchInput" type="search" placeholder="Title, state, agency, keyword">
        </label>
        <label>
          Status
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option>Pursue</option>
            <option>Monitor</option>
            <option>Decline</option>
            <option>Unreviewed</option>
          </select>
        </label>
        <label>
          Minimum fit
          <input id="scoreFilter" type="number" min="0" max="100" value="0">
        </label>
      </section>

      <section class="workspace">
        <section class="panel table-panel">
          <div class="panel-heading">
            <h2>Opportunities</h2>
            <span id="resultCount"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Opportunity</th>
                  <th>Category / Data check</th>
                  <th>State</th>
                  <th>Due</th>
                  <th>Fit</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="opportunityRows"></tbody>
            </table>
          </div>
        </section>

        <aside class="panel detail-panel" id="detailPanel">
          <p class="muted">Select an opportunity to review details.</p>
        </aside>
      </section>

      <footer class="data-footer">
        <details>
          <summary>Monitored sources <span id="sourceCount"></span></summary>
          <div id="sourcesList" class="footer-list"></div>
        </details>
        <details>
          <summary>Scoring model <span id="ruleCount"></span></summary>
          <div id="rulesList" class="footer-list"></div>
        </details>
      </footer>
    </main>

    <script src="/static/app.js?v=20260727-1"></script>
  </body>
</html>
