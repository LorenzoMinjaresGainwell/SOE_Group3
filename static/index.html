<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Growth Intelligence Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260728-19">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/gainwell-logo.png" alt="Gainwell Technologies">
        <div class="brand-title">
          <h1>Growth Intelligence Dashboard</h1>
        </div>
      </div>
      <a class="button-link button-link-secondary" href="/?view=records">Federal explorer</a>
    </header>

    <main>
      <nav class="focus-tabs" id="focusTabs" aria-label="Dashboard views">
        <span>Focus views</span>
        <button type="button" class="focus-tab active" data-view="records" aria-pressed="true">Family records</button>
        <button type="button" class="focus-tab" data-view="rht" aria-pressed="false">RHT tracker</button>
        <button type="button" class="focus-tab" data-view="competitors" aria-pressed="false">Competitor Intelligence</button>
      </nav>

      <div id="familyView">
      <nav class="primary-tabs" id="primaryTabs" aria-label="Record families" role="tablist">
        <button type="button" class="primary-tab active" data-family="opportunities" role="tab" aria-controls="dashboardWorkspace" aria-selected="true">New opportunities</button>
        <button type="button" class="primary-tab" data-family="contracts" role="tab" aria-controls="dashboardWorkspace" aria-selected="false">Contracts &amp; recompetes</button>
        <button type="button" class="primary-tab" data-family="updates" role="tab" aria-controls="dashboardWorkspace" aria-selected="false">Updates</button>
      </nav>

      <section class="metrics" id="metrics" aria-label="Dashboard summary"></section>

      <section class="toolbar" id="filterBar" aria-label="Dashboard filters">
        <label class="search-field">
          Search
          <input id="searchInput" type="search" placeholder="Search title, agency, vendor, or keyword" autocomplete="off">
        </label>
        <label>
          Jurisdiction
          <select id="jurisdictionFilter">
            <option value="">Nationwide</option>
            <option value="Federal">Federal only</option>
            <optgroup label="States and territories">
              <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option>
              <option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option>
              <option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="DC">District of Columbia</option>
              <option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option>
              <option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option>
              <option value="IA">Iowa</option><option value="KS">Kansas</option><option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option>
              <option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option>
              <option value="NE">Nebraska</option><option value="NV">Nevada</option><option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option>
              <option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option><option value="SC">South Carolina</option><option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option>
              <option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option>
              <option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
              <option value="AS">American Samoa</option><option value="GU">Guam</option><option value="MP">Northern Mariana Islands</option>
              <option value="PR">Puerto Rico</option><option value="VI">U.S. Virgin Islands</option>
            </optgroup>
          </select>
        </label>
        <div class="family-filters" id="familyFilters"></div>
      </section>

      <div class="notice" id="pageNotice" role="status" aria-live="polite" hidden></div>

      <section class="workspace" id="dashboardWorkspace">
        <section class="panel table-panel" aria-busy="true" id="tablePanel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker" id="panelKicker">Pipeline</p>
              <h2 id="tableTitle">New opportunities</h2>
            </div>
            <span id="resultCount"></span>
          </div>
          <div class="table-wrap" role="region" tabindex="0" aria-label="Family records table">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="dashboardRows"></tbody>
            </table>
          </div>
        </section>

        <aside class="panel detail-panel" id="detailPanel" aria-live="polite">
          <p class="muted">Select a record to review details.</p>
        </aside>
      </section>
      </div>

      <section class="focus-view panel" id="focusView" aria-live="polite" aria-busy="false" hidden></section>
    </main>

    <script src="/static/app.js?v=20260728-19"></script>
  </body>
</html>
